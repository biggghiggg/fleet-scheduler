  const [ubEditId,setUbEditId]=useState(null);
  const [showArchived,setShowArchived]=useState(false);
  const [historyBin,setHistoryBin]=useState(null);
  const [newVendor,setNewVendor]=useState('');
  const today=new Date();
  const [reportMonth,setReportMonth]=useState(()=>today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0'));

  const bins=data.bins||[];
  const vendors=data.vendors||[];
  const unbilled=data.unbilled||[];
  const activeBins=bins.filter(b=>!b.archived);
  const archivedBins=bins.filter(b=>b.archived);
  const custNames=(data.customers||[]).map(c=>c.name).filter(Boolean).sort();
  const driverNames=(data.drivers||[]).map(d=>d.name).filter(Boolean);

  /* parse YYYY-MM-DD at local noon to avoid timezone drift */
  const pd=(s)=>{if(!s)return null;const p=s.split('-');if(p.length!==3)return null;return new Date(+p[0],+p[1]-1,+p[2],12,0,0);};
  const daysBetween=(a,b)=>Math.round((b-a)/86400000)+1; /* inclusive */
  const binStatus=(b)=>b.dateReturnedToVendor?'Returned to vendor':(b.dateToInventory?'In inventory':(b.datePickedUp?'Picked up':'At customer'));
  const statusColor=(s)=>s==='At customer'?{bg:'#fef3c7',fg:'#92400e'}:s==='Picked up'?{bg:'#dbeafe',fg:'#1e40af'}:s==='In inventory'?{bg:'#e0e7ff',fg:'#3730a3'}:{bg:'#dcfce7',fg:'#166534'};

  const openAdd=()=>{setEditId(null);setForm({...empty});setShowForm(true);};
  const openEdit=(b)=>{setEditId(b.id);setForm({binNumber:b.binNumber||'',binSize:b.binSize||'20 yard',vendor:b.vendor||'',customer:b.customer||'',driver:b.driver||'',dateDropped:b.dateDropped||'',datePickedUp:b.datePickedUp||'',dateToInventory:b.dateToInventory||'',dateReturnedToVendor:b.dateReturnedToVendor||'',dailyRate:b.dailyRate||'',haulFee:b.haulFee||'',vendorDayRate:b.vendorDayRate||'',vendorHaulCost:b.vendorHaulCost||'',notes:b.notes||''});setShowForm(true);};
  const save=async()=>{
    if(!form.binNumber.trim()){alert('Bin number is required');return;}
    if(!form.dateDropped){alert('Date dropped is required');return;}
    const payload={...form,binNumber:form.binNumber.trim(),vendor:form.vendor.trim(),customer:form.customer.trim(),driver:form.driver.trim(),dailyRate:parseFloat(form.dailyRate)||0,haulFee:parseFloat(form.haulFee)||0,vendorDayRate:parseFloat(form.vendorDayRate)||0,vendorHaulCost:parseFloat(form.vendorHaulCost)||0};
    if(form.vendor.trim()&&vendors.indexOf(form.vendor.trim())===-1){await api('POST','/vendors',{name:form.vendor.trim()});}
    if(editId){await api('PUT','/bins/'+editId,payload);}else{await api('POST','/bins',payload);}
    setShowForm(false);setEditId(null);setForm(empty);
  };
  const archive=async(b)=>{if(!confirm('Archive bin '+b.binNumber+' / '+(b.customer||'no customer')+'?\n\nIt will be hidden from the active list and removed from billing, but kept in history. You can restore it anytime.'))return;await api('PUT','/bins/'+b.id,{archived:true});};
  const restore=async(b)=>{await api('PUT','/bins/'+b.id,{archived:false});};
  const hardDel=async(b)=>{if(!confirm('PERMANENTLY delete bin '+b.binNumber+' / '+(b.customer||'no customer')+'?\n\nThis cannot be undone and removes it from history too.'))return;await api('DELETE','/bins/'+b.id);};
  const openHistory=(num)=>{if(num)setHistoryBin(num);};
  const quickReturn=async(b)=>{const d=prompt('Date returned to vendor (YYYY-MM-DD):',(new Date()).toISOString().slice(0,10));if(!d)return;const patch={dateReturnedToVendor:d};if(!b.datePickedUp)patch.datePickedUp=d;await api('PUT','/bins/'+b.id,patch);};
  const quickInventory=async(b)=>{const d=prompt('Date put into our inventory / yard (YYYY-MM-DD):',(new Date()).toISOString().slice(0,10));if(!d)return;const patch={dateToInventory:d};if(!b.datePickedUp)patch.datePickedUp=d;await api('PUT','/bins/'+b.id,patch);};
  const quickPickup=async(b)=>{const d=prompt('Date picked up from customer (YYYY-MM-DD):',(new Date()).toISOString().slice(0,10));if(!d)return;await api('PUT','/bins/'+b.id,{datePickedUp:d});};

  /* ---- Unaccounted bins (vendor-billed, not in tracking) ---- */
  const inTracking=(num)=>!!num&&bins.some(b=>(b.binNumber||'').toLowerCase()===num.toLowerCase());
  const ubStatusColor=(s)=>s==='Resolved'?{bg:'#dcfce7',fg:'#166534'}:s==='Investigating'?{bg:'#fef3c7',fg:'#92400e'}:{bg:'#fee2e2',fg:'#b91c1c'};
  const ubOpenAdd=()=>{setUbEditId(null);setUbForm({...ubEmpty});setShowUbForm(true);};
  const ubOpenEdit=(u)=>{setUbEditId(u.id);setUbForm({binNumber:u.binNumber||'',vendor:u.vendor||'',amount:u.amount||'',dateBilled:u.dateBilled||'',status:u.status||'Open',notes:u.notes||''});setShowUbForm(true);};
  const ubSave=async()=>{
    if(!ubForm.binNumber.trim()&&!ubForm.vendor.trim()){alert('Enter at least a bin number or vendor.');return;}
    const payload={...ubForm,binNumber:ubForm.binNumber.trim(),vendor:ubForm.vendor.trim(),amount:parseFloat(ubForm.amount)||0};
    if(ubForm.vendor.trim()&&vendors.indexOf(ubForm.vendor.trim())===-1){await api('POST','/vendors',{name:ubForm.vendor.trim()});}
    if(ubEditId){await api('PUT','/unbilled/'+ubEditId,payload);}else{await api('POST','/unbilled',payload);}
    setShowUbForm(false);setUbEditId(null);setUbForm(ubEmpty);
  };
  const ubDel=async(u)=>{if(!confirm('Remove this entry'+(u.binNumber?' for bin '+u.binNumber:'')+'?'))return;await api('DELETE','/unbilled/'+u.id);};
  const ubSetStatus=async(u,status)=>{await api('PUT','/unbilled/'+u.id,{status});};

  /* filtered table view */
  const filtered=activeBins.filter(b=>{
    if(statusFilter!=='all'&&binStatus(b)!==statusFilter)return false;
    if(!search.trim())return true;
    const q=search.toLowerCase();
    return [b.binNumber,b.customer,b.vendor,b.driver,b.binSize].some(v=>(v||'').toLowerCase().includes(q));
  }).sort((a,b)=>(b.dateDropped||'').localeCompare(a.dateDropped||''));

  /* ---- monthly billing report ---- */
  const IDLE_LABEL='— In inventory (cost only) —';
  const report=useMemo(()=>{
    const parts=reportMonth.split('-');
    if(parts.length!==2)return{groups:[],grandTotal:0,grandCost:0,grandMargin:0,monthLabel:''};
    const yr=+parts[0],mo=+parts[1]-1;
    const first=new Date(yr,mo,1,12,0,0);
    const last=new Date(yr,mo+1,0,12,0,0);
    const now=new Date();now.setHours(12,0,0,0);
    const monthLabel=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    /* chain placements of the same physical bin so vendor cost isn't double-counted */
    const act=bins.filter(b=>!b.archived);
    const dropsByBin={};
    act.forEach(b=>{const d=pd(b.dateDropped);if(!d)return;(dropsByBin[b.binNumber]=dropsByBin[b.binNumber]||[]).push(d.getTime());});
    Object.values(dropsByBin).forEach(a=>a.sort((x,y)=>x-y));
    const byCust={};
    act.forEach(b=>{
      const drop=pd(b.dateDropped);if(!drop)return;
      const dailyRate=parseFloat(b.dailyRate)||0;
      const haulFee=parseFloat(b.haulFee)||0;
      const vendorDayRate=parseFloat(b.vendorDayRate)||0;
      const vendorHaulCost=parseFloat(b.vendorHaulCost)||0;
      const haulApplies=drop>=first&&drop<=last;     /* delivery billed in month dropped */
      /* ---- customer revenue: days the bin sat at the customer (drop -> pickup / today) ---- */
      let custDays=0;
      const custEnd=pd(b.datePickedUp)||now;
      if(drop<=last&&custEnd>=first){
        const ps=drop>first?drop:first;const pe=custEnd<last?custEnd:last;
        custDays=pe>=ps?daysBetween(ps,pe):0;
      }
      const lineTotal=custDays*dailyRate+(haulApplies?haulFee:0);
      /* ---- vendor cost: we pay from drop until the bin goes back to the vendor,
              including time it sits in our inventory. Bounded by the bin's next
              placement so the same physical bin is never double-charged. ---- */
      let vEnd;
      if(b.dateReturnedToVendor){vEnd=pd(b.dateReturnedToVendor);}
      else{
        const arr=dropsByBin[b.binNumber]||[];
        const nextTs=arr.find(t=>t>drop.getTime());
        vEnd=nextTs?new Date(nextTs-86400000):now;   /* day before next placement, else today */
      }
      let vendorDays=0;
      if(vEnd&&drop<=last&&vEnd>=first){
        const vps=drop>first?drop:first;const vpe=vEnd<last?vEnd:last;
        vendorDays=vpe>=vps?daysBetween(vps,vpe):0;
      }
      const vendorCost=vendorDays*vendorDayRate+(haulApplies?vendorHaulCost:0);
      const margin=lineTotal-vendorCost;
      const billable=lineTotal>0||custDays>0;
      if(!billable&&vendorCost===0)return;           /* nothing to show this month */
      const grp=billable?(b.customer||'(no customer)'):IDLE_LABEL;
      if(!byCust[grp])byCust[grp]={customer:grp,rows:[],subtotal:0,vendorCost:0,margin:0,idle:!billable};
      byCust[grp].rows.push({binNumber:b.binNumber,binSize:b.binSize,vendor:b.vendor,dateDropped:b.dateDropped,datePickedUp:b.datePickedUp,days:custDays,dailyRate,haulFee:haulApplies?haulFee:0,lineTotal,vendorDays,vendorCost,margin,billable});
      byCust[grp].subtotal+=lineTotal;
      byCust[grp].vendorCost+=vendorCost;
      byCust[grp].margin+=margin;
    });
    const groups=Object.values(byCust).sort((a,b)=>{
      if(a.idle!==b.idle)return a.idle?1:-1;         /* idle bucket sorts last */
      return a.customer.localeCompare(b.customer);
    });
    const grandTotal=groups.reduce((s,g)=>s+g.subtotal,0);
    const grandCost=groups.reduce((s,g)=>s+g.vendorCost,0);
    const grandMargin=grandTotal-grandCost;
    return{groups,grandTotal,grandCost,grandMargin,monthLabel};
  },[bins,reportMonth]);

  const money=(n)=>'$'+(Number(n)||0).toFixed(2);
  const visibleGroups=showMargin?report.groups:report.groups.filter(g=>!g.idle);
  const billableGroups=report.groups.filter(g=>!g.idle);
  const unbilledOpenTotal=unbilled.filter(u=>u.status!=='Resolved').reduce((s,u)=>s+(parseFloat(u.amount)||0),0);

  const printReport=()=>{
    const f=document.createElement('form');f.method='POST';f.action='/print-bin-report';f.target='_blank';
    const inp=document.createElement('input');inp.type='hidden';inp.name='reportData';
    inp.value=JSON.stringify({monthLabel:report.monthLabel,groups:billableGroups,grandTotal:report.grandTotal});
    f.appendChild(inp);document.body.appendChild(f);f.submit();document.body.removeChild(f);
  };
  const exportExcel=()=>{
    const grps=showMargin?report.groups:billableGroups;
    const head=['Customer','Bin #','Size','Vendor','Dropped','Picked Up','Cust Days','Day Rate','Haul Fee','Line Total'];
    if(showMargin)head.push('Vendor Days','Vendor Cost','Margin');
    const rows=[head];
    grps.forEach(g=>{
      g.rows.forEach(r=>{const row=[g.customer,r.binNumber,r.binSize,r.vendor,r.dateDropped,r.datePickedUp||'On site',r.days,r.dailyRate,r.haulFee,r.lineTotal];if(showMargin)row.push(r.vendorDays,r.vendorCost,r.margin);rows.push(row);});
      const sub=['',' ','','','','','','','Subtotal',g.subtotal];if(showMargin)sub.push('',g.vendorCost,g.margin);rows.push(sub);
    });
    const gt=['','','','','','','','','GRAND TOTAL',report.grandTotal];if(showMargin)gt.push('',report.grandCost,report.grandMargin);rows.push(gt);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Bin Billing');
    XLSX.writeFile(wb,'Bin-Billing-'+reportMonth+(showMargin?'-internal':'')+'.xlsx');
  };

  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
      <div className="stitle" style={{margin:0}}>Roll-Off Bin Tracking ({activeBins.length})</div>
      <button className="bp" onClick={openAdd}>+ Log Bin Movement</button>
    </div>
    <div style={{fontSize:12,color:'var(--text-muted)',margin:'4px 0 14px'}}>Enter bins from the drivers' Daily Tickets as they drop, pick up, and return. Use the Monthly Billing Report below to bill customers.</div>

    <div className="addrow">
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search bin #, customer, vendor, driver..." style={{flex:2}}/>
      <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{maxWidth:200}}>
        <option value="all">All statuses</option>
        <option value="At customer">At customer</option>
        <option value="Picked up">Picked up</option>
        <option value="In inventory">In inventory</option>
        <option value="Returned to vendor">Returned to vendor</option>
      </select>
    </div>

    <div className="rtable">
      <table>
        <thead><tr>
          <th>Bin #</th><th>Size</th><th>Customer</th><th>Vendor</th><th>Driver</th><th>Dropped</th><th>Picked Up</th><th>Vendor / Inv</th><th>Status</th><th>Rates</th><th></th>
        </tr></thead>
        <tbody>
          {filtered.length===0&&<tr><td colSpan={11} style={{textAlign:'center',color:'var(--text-muted)',padding:24}}>No bins logged yet. Click "+ Log Bin Movement" to start.</td></tr>}
          {filtered.map(b=>{const s=binStatus(b);const sc=statusColor(s);return(<tr key={b.id}>
            <td style={{fontWeight:700}}><span onClick={()=>openHistory(b.binNumber)} style={{color:'var(--primary)',cursor:'pointer',textDecoration:'underline'}} title="View full history of this bin">{b.binNumber}</span></td>
            <td>{b.binSize}</td>
            <td>{b.customer||<span style={{color:'#bbb'}}>&mdash;</span>}</td>
            <td>{b.vendor||<span style={{color:'#bbb'}}>&mdash;</span>}</td>
            <td>{b.driver||<span style={{color:'#bbb'}}>&mdash;</span>}</td>
            <td>{b.dateDropped||'—'}</td>
            <td>{b.datePickedUp||<span style={{color:'#bbb'}}>&mdash;</span>}</td>
            <td>{b.dateReturnedToVendor?b.dateReturnedToVendor:(b.dateToInventory?<span style={{color:'#3730a3'}}>Inv {b.dateToInventory}</span>:<span style={{color:'#bbb'}}>&mdash;</span>)}</td>
            <td><span style={{background:sc.bg,color:sc.fg,padding:'2px 8px',borderRadius:10,fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>{s}</span></td>
            <td style={{fontSize:11,whiteSpace:'nowrap'}}>{money(b.dailyRate)}/day{(parseFloat(b.haulFee)||0)>0?' + '+money(b.haulFee)+' haul':''}</td>
            <td style={{whiteSpace:'nowrap'}}>
              {!b.datePickedUp&&<button className="ebtn" onClick={()=>quickPickup(b)}>Pick up</button>}
              {b.datePickedUp&&!b.dateReturnedToVendor&&!b.dateToInventory&&<button className="ebtn" onClick={()=>quickInventory(b)}>To Inventory</button>}
              {b.datePickedUp&&!b.dateReturnedToVendor&&<button className="ebtn" onClick={()=>quickReturn(b)}>To Vendor</button>}
              <button className="ebtn" onClick={()=>openHistory(b.binNumber)}>History</button>
              <button className="ebtn" onClick={()=>openEdit(b)}>Edit</button>
              <button className="ebtn" style={{background:'#fef3c7',color:'#92400e'}} onClick={()=>archive(b)}>Archive</button>
            </td>
          </tr>);})}
        </tbody>
      </table>
    </div>

    {/* ARCHIVED BINS */}
    {archivedBins.length>0&&<div style={{marginTop:14}}>
      <button className="ebtn" onClick={()=>setShowArchived(s=>!s)}>{showArchived?'Hide':'Show'} archived bins ({archivedBins.length})</button>
      {showArchived&&<div className="rtable" style={{marginTop:8}}>
        <table>
          <thead><tr><th>Bin #</th><th>Size</th><th>Customer</th><th>Vendor</th><th>Dropped</th><th>Picked Up</th><th>Vendor / Inv</th><th></th></tr></thead>
          <tbody>
            {archivedBins.slice().sort((a,b)=>(b.dateDropped||'').localeCompare(a.dateDropped||'')).map(b=>(<tr key={b.id} style={{opacity:0.75}}>
              <td style={{fontWeight:700}}><span onClick={()=>openHistory(b.binNumber)} style={{color:'var(--primary)',cursor:'pointer',textDecoration:'underline'}}>{b.binNumber}</span></td>
              <td>{b.binSize}</td><td>{b.customer||'—'}</td><td>{b.vendor||'—'}</td><td>{b.dateDropped||'—'}</td><td>{b.datePickedUp||'—'}</td>
              <td>{b.dateReturnedToVendor||(b.dateToInventory?'Inv '+b.dateToInventory:'—')}</td>
              <td style={{whiteSpace:'nowrap'}}>
                <button className="ebtn" onClick={()=>restore(b)}>Restore</button>
                <button className="ebtn" style={{background:'#fee2e2',color:'var(--danger)'}} onClick={()=>hardDel(b)}>Delete</button>
              </td>
            </tr>))}
          </tbody>
        </table>
      </div>}
    </div>}

    {/* MONTHLY BILLING REPORT */}
    <div className="stitle" style={{marginTop:32}}>Monthly Billing Report</div>
    <div className="addrow" style={{alignItems:'center'}}>
      <label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',width:'auto'}}>Billing month:</label>
      <input type="month" value={reportMonth} onChange={e=>setReportMonth(e.target.value)} style={{maxWidth:180}}/>
      <button className="bp" onClick={printReport} disabled={billableGroups.length===0}>Print / PDF</button>
      <button onClick={exportExcel} disabled={visibleGroups.length===0} style={{background:'#16a34a',color:'#fff',fontWeight:600,padding:'8px 16px'}}>Export to Excel</button>
      <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,fontWeight:600,color:'var(--text-muted)',width:'auto',cursor:'pointer',whiteSpace:'nowrap'}}>
        <input type="checkbox" checked={showMargin} onChange={e=>setShowMargin(e.target.checked)} style={{width:'auto'}}/>Show margin (internal)
      </label>
    </div>
    <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>Bills each customer for days the bin was on site during {report.monthLabel||'the selected month'} (day rate &times; days), plus the haul fee in the month the bin was dropped. Bins still on site count through today.{showMargin?' Vendor cost covers the whole time we hold the bin — including days it sits in our inventory — from drop until it goes back to the vendor. Cost & margin are for your eyes only; the printed customer bill never includes them. Bins sitting idle in inventory appear in their own “cost only” group.':''}</div>

    {visibleGroups.length===0?(
      <div style={{padding:24,textAlign:'center',color:'var(--text-muted)',background:'var(--bg-white)',borderRadius:10,boxShadow:'var(--shadow)'}}>No billable bin activity for {report.monthLabel||'this month'}.</div>
    ):(
      <div>
        {visibleGroups.map((g,gi)=>(<div key={gi} style={{marginBottom:18}}>
          <div style={{fontWeight:800,fontSize:14,background:g.idle?'#eef2ff':'#eff6ff',borderLeft:'4px solid '+(g.idle?'#6366f1':'var(--primary)'),padding:'6px 10px',marginBottom:6,color:g.idle?'#3730a3':'inherit'}}>{g.customer}{g.idle?' — still on vendor rent, no customer billing':''}</div>
          <div className="rtable">
            <table>
              <thead><tr><th>Bin #</th><th>Size</th><th>Vendor</th><th>Dropped</th><th>Picked Up</th><th style={{textAlign:'right'}}>{showMargin?'Cust Days':'Days'}</th><th style={{textAlign:'right'}}>Day Rate</th><th style={{textAlign:'right'}}>Haul Fee</th><th style={{textAlign:'right'}}>Line Total</th>{showMargin&&<th style={{textAlign:'right',color:'#b45309'}}>Vend Days</th>}{showMargin&&<th style={{textAlign:'right',color:'#b45309'}}>Vendor Cost</th>}{showMargin&&<th style={{textAlign:'right',color:'#166534'}}>Margin</th>}</tr></thead>
              <tbody>
                {g.rows.map((r,ri)=>(<tr key={ri}>
                  <td style={{fontWeight:600}}>{r.binNumber}</td><td>{r.binSize}</td><td>{r.vendor}</td><td>{r.dateDropped}</td><td>{r.datePickedUp||'On site'}</td>
                  <td style={{textAlign:'right'}}>{r.days}</td><td style={{textAlign:'right'}}>{money(r.dailyRate)}</td><td style={{textAlign:'right'}}>{money(r.haulFee)}</td><td style={{textAlign:'right',fontWeight:700}}>{money(r.lineTotal)}</td>
                  {showMargin&&<td style={{textAlign:'right',color:'#b45309'}}>{r.vendorDays}</td>}{showMargin&&<td style={{textAlign:'right',color:'#b45309'}}>{money(r.vendorCost)}</td>}{showMargin&&<td style={{textAlign:'right',fontWeight:700,color:r.margin<0?'var(--danger)':'#166534'}}>{money(r.margin)}</td>}
                </tr>))}
                <tr><td colSpan={8} style={{textAlign:'right',fontWeight:700,background:'#f8fafc'}}>Subtotal</td><td style={{textAlign:'right',fontWeight:800,background:'#f8fafc'}}>{money(g.subtotal)}</td>{showMargin&&<td style={{background:'#f8fafc'}}></td>}{showMargin&&<td style={{textAlign:'right',fontWeight:700,background:'#f8fafc',color:'#b45309'}}>{money(g.vendorCost)}</td>}{showMargin&&<td style={{textAlign:'right',fontWeight:800,background:'#f8fafc',color:g.margin<0?'var(--danger)':'#166534'}}>{money(g.margin)}</td>}</tr>
              </tbody>
            </table>
          </div>
        </div>))}
        <div style={{marginTop:8,padding:'12px 16px',border:'3px solid var(--success)',borderRadius:10,background:'#f0fdf4',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:17,fontWeight:900}}>
          <span>BILLED TO CUSTOMERS &mdash; {report.monthLabel}</span><span>{money(report.grandTotal)}</span>
        </div>
        {showMargin&&<div style={{marginTop:8,display:'flex',gap:10,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:160,padding:'10px 14px',border:'2px solid #b45309',borderRadius:10,background:'#fffbeb',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:14,fontWeight:700,color:'#92400e'}}><span>Vendor Cost</span><span>{money(report.grandCost)}</span></div>
          <div style={{flex:1,minWidth:160,padding:'10px 14px',border:'2px solid',borderColor:report.grandMargin<0?'var(--danger)':'#166534',borderRadius:10,background:report.grandMargin<0?'#fef2f2':'#f0fdf4',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:15,fontWeight:800,color:report.grandMargin<0?'var(--danger)':'#166534'}}><span>Margin{report.grandTotal>0?' ('+Math.round(report.grandMargin/report.grandTotal*100)+'%)':''}</span><span>{money(report.grandMargin)}</span></div>
        </div>}
      </div>
    )}

    {/* UNACCOUNTED BINS */}
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginTop:32}}>
      <div className="stitle" style={{margin:0}}>Unaccounted Bins ({unbilled.length})</div>
      <button className="bp" onClick={ubOpenAdd}>+ Add Unaccounted Bin</button>
    </div>
    <div style={{fontSize:12,color:'var(--text-muted)',margin:'4px 0 12px'}}>For the biller: log bins a vendor is charging us for that aren't in the tracking list above, so they can be found or explained. {unbilledOpenTotal>0?'Open / investigating total: '+money(unbilledOpenTotal):''}</div>
    <div className="rtable">
      <table>
        <thead><tr><th>Bin #</th><th>Vendor</th><th style={{textAlign:'right'}}>Amount</th><th>Date Billed</th><th>In Tracking?</th><th>Status</th><th>Notes</th><th></th></tr></thead>
        <tbody>
          {unbilled.length===0&&<tr><td colSpan={8} style={{textAlign:'center',color:'var(--text-muted)',padding:20}}>Nothing logged. Use this when a vendor bills for a bin you can't find in tracking.</td></tr>}
          {unbilled.map(u=>{const sc=ubStatusColor(u.status||'Open');const tracked=inTracking(u.binNumber);return(<tr key={u.id} style={{opacity:u.status==='Resolved'?0.55:1}}>
            <td style={{fontWeight:600}}>{u.binNumber||<span style={{color:'#bbb'}}>&mdash;</span>}</td>
            <td>{u.vendor||<span style={{color:'#bbb'}}>&mdash;</span>}</td>
            <td style={{textAlign:'right'}}>{money(u.amount)}</td>
            <td>{u.dateBilled||<span style={{color:'#bbb'}}>&mdash;</span>}</td>
            <td>{u.binNumber?(tracked?<span style={{color:'#166534',fontWeight:600}}>Yes</span>:<span style={{color:'#b91c1c',fontWeight:600}}>Not found</span>):<span style={{color:'#bbb'}}>&mdash;</span>}</td>
            <td><select value={u.status||'Open'} onChange={e=>ubSetStatus(u,e.target.value)} style={{width:'auto',padding:'2px 8px',fontSize:11,background:sc.bg,color:sc.fg,fontWeight:600,border:'none',borderRadius:10}}>
              <option>Open</option><option>Investigating</option><option>Resolved</option></select></td>
            <td style={{fontSize:11,maxWidth:220,whiteSpace:'normal'}}>{u.notes||<span style={{color:'#bbb'}}>&mdash;</span>}</td>
            <td style={{whiteSpace:'nowrap'}}>
              <button className="ebtn" onClick={()=>ubOpenEdit(u)}>Edit</button>
              <button className="ebtn" style={{background:'#fee2e2',color:'var(--danger)'}} onClick={()=>ubDel(u)}>Del</button>
            </td>
          </tr>);})}
        </tbody>
      </table>
    </div>

    {/* MANAGE VENDORS */}
    <div className="stitle" style={{marginTop:32}}>Bin Vendors (suppliers)</div>
    <div className="addrow">
      <input value={newVendor} onChange={e=>setNewVendor(e.target.value)} placeholder="New vendor name" onKeyDown={async e=>{if(e.key==='Enter'&&newVendor.trim()){await api('POST','/vendors',{name:newVendor.trim()});setNewVendor('');}}}/>
      <button className="bp" onClick={async()=>{if(newVendor.trim()){await api('POST','/vendors',{name:newVendor.trim()});setNewVendor('');}}}>Add</button>
    </div>
    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
      {vendors.length===0&&<span style={{fontSize:12,color:'var(--text-muted)'}}>No vendors yet — they'll be added automatically when you type one on a bin, or add them here.</span>}
      {vendors.map((v,i)=>(<span key={i} style={{background:'#f0fdf4',border:'1px solid #86efac',padding:'4px 10px',borderRadius:6,fontSize:12,display:'flex',alignItems:'center',gap:6}}>
        {v}<span style={{cursor:'pointer',color:'#999',fontSize:10}} onClick={()=>api('DELETE','/vendors/'+encodeURIComponent(v))}>&#10005;</span>
      </span>))}
    </div>

    {/* ADD/EDIT MODAL */}
    {showForm&&<div className="overlay" onClick={()=>setShowForm(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>{editId?'Edit Bin Movement':'Log Bin Movement'}</h2>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="mrow"><label>Bin Number *</label><input value={form.binNumber} onChange={e=>setForm({...form,binNumber:e.target.value})} placeholder="e.g. RO-1042" autoFocus/></div>
          <div className="mrow"><label>Bin Size</label><select value={form.binSize} onChange={e=>setForm({...form,binSize:e.target.value})}>{BIN_SIZES.map(s=><option key={s}>{s}</option>)}</select></div>
          <div className="mrow"><label>Customer</label><input list="bin-cust-list" value={form.customer} onChange={e=>setForm({...form,customer:e.target.value})} placeholder="Who it's rented to"/>
            <datalist id="bin-cust-list">{custNames.map((c,i)=><option key={i} value={c}/>)}</datalist></div>
          <div className="mrow"><label>Vendor (supplier)</label><input list="bin-vendor-list" value={form.vendor} onChange={e=>setForm({...form,vendor:e.target.value})} placeholder="Who you rent it from"/>
            <datalist id="bin-vendor-list">{vendors.map((v,i)=><option key={i} value={v}/>)}</datalist></div>
          <div className="mrow"><label>Driver</label><input list="bin-driver-list" value={form.driver} onChange={e=>setForm({...form,driver:e.target.value})} placeholder="Driver who moved it"/>
            <datalist id="bin-driver-list">{driverNames.map((d,i)=><option key={i} value={d}/>)}</datalist></div>
          <div className="mrow"><label>Date Dropped *</label><input type="date" value={form.dateDropped} onChange={e=>setForm({...form,dateDropped:e.target.value})}/></div>
          <div className="mrow"><label>Date Picked Up</label>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <input type="date" value={form.datePickedUp} onChange={e=>setForm({...form,datePickedUp:e.target.value})}/>
              {form.datePickedUp&&<button type="button" className="bc" style={{padding:'6px 10px',whiteSpace:'nowrap'}} onClick={()=>setForm({...form,datePickedUp:''})}>Clear</button>}
            </div>
          </div>
          <div className="mrow"><label>Date To Inventory / Yard</label>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <input type="date" value={form.dateToInventory} onChange={e=>setForm({...form,dateToInventory:e.target.value})}/>
              {form.dateToInventory&&<button type="button" className="bc" style={{padding:'6px 10px',whiteSpace:'nowrap'}} onClick={()=>setForm({...form,dateToInventory:''})}>Clear</button>}
            </div>
          </div>
          <div className="mrow"><label>Date Returned to Vendor</label>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <input type="date" value={form.dateReturnedToVendor} onChange={e=>setForm({...form,dateReturnedToVendor:e.target.value})}/>
              {form.dateReturnedToVendor&&<button type="button" className="bc" style={{padding:'6px 10px',whiteSpace:'nowrap'}} onClick={()=>setForm({...form,dateReturnedToVendor:''})}>Clear</button>}
            </div>
          </div>
          <div className="mrow"><label>Day Rate ($/day to customer)</label><input type="number" step="0.01" value={form.dailyRate} onChange={e=>setForm({...form,dailyRate:e.target.value})} placeholder="0.00"/></div>
          <div className="mrow"><label>Haul / Delivery Fee ($)</label><input type="number" step="0.01" value={form.haulFee} onChange={e=>setForm({...form,haulFee:e.target.value})} placeholder="0.00"/></div>
          <div className="mrow"><label style={{color:'#b45309'}}>Vendor Day Cost ($/day you pay)</label><input type="number" step="0.01" value={form.vendorDayRate} onChange={e=>setForm({...form,vendorDayRate:e.target.value})} placeholder="0.00"/></div>
          <div className="mrow"><label style={{color:'#b45309'}}>Vendor Haul Cost ($)</label><input type="number" step="0.01" value={form.vendorHaulCost} onChange={e=>setForm({...form,vendorHaulCost:e.target.value})} placeholder="0.00"/></div>
        </div>
        <div className="mrow"><label>Notes</label><textarea rows={2} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="From the Daily Ticket — anything worth noting"/></div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>Flat per-haul billing? Leave Day Rate at 0 and put the flat charge in Haul / Delivery Fee.</div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>Set a date by mistake? Click <strong>Clear</strong> next to it and Save — e.g. clearing Date Picked Up sets the bin back to “At customer.”</div>
        <div className="mactions">
          <button className="bc" onClick={()=>setShowForm(false)}>Cancel</button>
          <button className="bp" onClick={save}>{editId?'Save Changes':'Add Bin'}</button>
        </div>
      </div>
    </div>}

    {/* UNACCOUNTED BIN ADD/EDIT MODAL */}
    {showUbForm&&<div className="overlay" onClick={()=>setShowUbForm(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>{ubEditId?'Edit Unaccounted Bin':'Add Unaccounted Bin'}</h2>
        <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:12}}>A bin a vendor is billing us for that isn't in tracking. Record what you know and use Notes/Status to work it.</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="mrow"><label>Bin Number</label><input value={ubForm.binNumber} onChange={e=>setUbForm({...ubForm,binNumber:e.target.value})} placeholder="From the vendor invoice" autoFocus/></div>
          <div className="mrow"><label>Vendor</label><input list="ub-vendor-list" value={ubForm.vendor} onChange={e=>setUbForm({...ubForm,vendor:e.target.value})} placeholder="Who billed us"/>
            <datalist id="ub-vendor-list">{vendors.map((v,i)=><option key={i} value={v}/>)}</datalist></div>
          <div className="mrow"><label>Amount Billed ($)</label><input type="number" step="0.01" value={ubForm.amount} onChange={e=>setUbForm({...ubForm,amount:e.target.value})} placeholder="0.00"/></div>
          <div className="mrow"><label>Date Billed</label><input type="date" value={ubForm.dateBilled} onChange={e=>setUbForm({...ubForm,dateBilled:e.target.value})}/></div>
          <div className="mrow"><label>Status</label><select value={ubForm.status} onChange={e=>setUbForm({...ubForm,status:e.target.value})}><option>Open</option><option>Investigating</option><option>Resolved</option></select></div>
        </div>
        <div className="mrow"><label>Notes / What Happened</label><textarea rows={3} value={ubForm.notes} onChange={e=>setUbForm({...ubForm,notes:e.target.value})} placeholder="What you found, who you called, where the bin might be, etc."/></div>
        <div className="mactions">
          <button className="bc" onClick={()=>setShowUbForm(false)}>Cancel</button>
          <button className="bp" onClick={ubSave}>{ubEditId?'Save Changes':'Add'}</button>
        </div>
      </div>
    </div>}

    {/* BIN HISTORY MODAL */}
    {historyBin&&(()=>{
      const hist=bins.filter(b=>(b.binNumber||'')===historyBin).slice().sort((a,b)=>(a.dateDropped||'').localeCompare(b.dateDropped||''));
      return <div className="overlay" onClick={()=>setHistoryBin(null)}>
        <div className="modal" style={{width:780}} onClick={e=>e.stopPropagation()}>
          <h2>Bin {historyBin} — History ({hist.length} {hist.length===1?'movement':'movements'})</h2>
          <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:12}}>Every recorded placement of this bin, oldest first. Includes archived entries.</div>
          <div className="rtable">
            <table>
              <thead><tr><th>Customer</th><th>Driver</th><th>Dropped</th><th>Picked Up</th><th>To Inv</th><th>To Vendor</th><th>Status</th></tr></thead>
              <tbody>
                {hist.length===0&&<tr><td colSpan={7} style={{textAlign:'center',color:'var(--text-muted)',padding:16}}>No records.</td></tr>}
                {hist.map(b=>{const s=binStatus(b);const sc=statusColor(s);return(<tr key={b.id} style={{opacity:b.archived?0.6:1}}>
                  <td>{b.customer||'—'}{b.archived?<span style={{fontSize:10,color:'#92400e',marginLeft:4}}>(archived)</span>:''}</td>
                  <td>{b.driver||'—'}</td><td>{b.dateDropped||'—'}</td><td>{b.datePickedUp||'—'}</td><td>{b.dateToInventory||'—'}</td><td>{b.dateReturnedToVendor||'—'}</td>
                  <td><span style={{background:sc.bg,color:sc.fg,padding:'2px 8px',borderRadius:10,fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>{s}</span></td>
                </tr>);})}
              </tbody>
            </table>
          </div>
          <div className="mactions"><button className="bc" onClick={()=>setHistoryBin(null)}>Close</button></div>
        </div>
      </div>;
    })()}
  </div>);
}

function Customers({data}){
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [search,setSearch]=useState('');
  const empty={name:'',address:'',city:'',state:'',zip:'',phone:'',email:'',contact:'',pricing:'',notes:'',epaId:'',stateId:'',generatorStatus:'',naicsCodes:''};
  const [form,setForm]=useState(empty);

  const openAdd=()=>{setEditId(null);setForm(empty);setShowForm(true);};
  const openEdit=(c)=>{setEditId(c.id);setForm({name:c.name||'',address:c.address||'',city:c.city||'',state:c.state||'',zip:c.zip||'',phone:c.phone||'',email:c.email||'',contact:c.contact||'',pricing:c.pricing||'',notes:c.notes||'',epaId:c.epaId||'',stateId:c.stateId||'',generatorStatus:c.generatorStatus||'',naicsCodes:c.naicsCodes||''});setShowForm(true);};
  const save=async()=>{
    if(!form.name.trim()){alert('Customer name is required');return;}
    if(editId){await api('PUT','/customers/'+editId,form);}
    else{await api('POST','/customers',form);}
    setShowForm(false);setEditId(null);setForm(empty);
  };
  const del=async(id,name)=>{if(!confirm('Delete "'+name+'"?'))return;await api('DELETE','/customers/'+id);};
  const deleteAll=async()=>{const count=(data.customers||[]).length;if(!count){alert('No customers to delete.');return;}if(!confirm('Are you sure you want to delete ALL '+count+' customers? This cannot be undone.')){return;}if(!confirm('FINAL WARNING: This will permanently delete all '+count+' customers. Continue?')){return;}await api('DELETE','/customers');setSearch('');};
  const importRef=useRef(null);
  const [importing,setImporting]=useState(false);
  const [importPreview,setImportPreview]=useState(null);

  const matchCol=(headers,options)=>{
    // Two-pass: first try exact-start matches (prefer shipping over billing), then substring
    for(const opt of options){
      for(let i=0;i<headers.length;i++){
        const h=headers[i].toLowerCase().replace(/[^a-z0-9]/g,'');
        if(h===opt||h.startsWith(opt))return i;
      }
    }
    for(const opt of options){
      for(let i=0;i<headers.length;i++){
        const h=headers[i].toLowerCase().replace(/[^a-z0-9]/g,'');
        if(h.includes(opt))return i;
      }
    }
    return -1;
  };

  const parseFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    setImporting(true);
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const allRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(allRows.length<2){alert('File appears empty or has no data rows.');setImporting(false);return;}

      /* Find real header row - QuickBooks puts title rows before actual headers */
      let headerRow=0;
      for(let i=0;i<Math.min(allRows.length,10);i++){
        const row=allRows[i];
        const vals=row.filter(v=>v&&String(v).trim());
        if(vals.length>=2){
          const joined=row.map(v=>String(v||'').toLowerCase()).join(' ');
          if(joined.includes('customer')||joined.includes('phone')||joined.includes('address')){headerRow=i;break;}
        }
      }
      const headers=allRows[headerRow].map(h=>String(h||''));
      const rows=allRows.slice(headerRow+1);

      const nameIdx=matchCol(headers,['customerfullname','customername','customer','company','name','companyname','displayname','fullname']);
      const addrIdx=matchCol(headers,['shippingstreet','shipaddress','shippingaddress','shipstreet','street','address','address1','billaddress','billingaddress','billingstreet','billstreet']);
      const cityIdx=matchCol(headers,['shippingcity','city','billingcity']);
      const stateIdx=matchCol(headers,['shippingstate','state','province','billingstate']);
      const zipIdx=matchCol(headers,['shippingzip','zip','postal','billingzip','zipcode','postalcode']);
      const phoneIdx=matchCol(headers,['phone','phonenumbers','telephone','mainphone','workphone','primaryphone']);
      const emailIdx=matchCol(headers,['email','emailaddress','mainemail']);
      const contactIdx=matchCol(headers,['contact','contactname','firstname','primarycontact']);
      const notesIdx=matchCol(headers,['note','notes','memo','comment','description']);

      if(nameIdx===-1){alert('Could not find a Customer Name column. Headers found: '+headers.join(', '));setImporting(false);return;}

      /* Parse combined address like "123 Main St Fresno CA 93702" into parts */
      const parseAddr=(str)=>{
        if(!str)return{address:'',city:'',state:'',zip:''};
        str=str.trim();
        const zipM=str.match(/\s(\d{5}(?:-\d{4})?)$/);
        const zip=zipM?zipM[1]:'';
        if(zipM)str=str.slice(0,zipM.index).trim();
        const stM=str.match(/\s([A-Z]{2}|California|Texas|Nevada|Arizona|Oregon|Washington|Colorado|Utah)$/i);
        let state='';
        if(stM){
          state=stM[1];
          const ab={california:'CA',texas:'TX',nevada:'NV',arizona:'AZ',oregon:'OR',washington:'WA',colorado:'CO',utah:'UT'};
          if(stM[1].length>2&&ab[stM[1].toLowerCase()])state=ab[stM[1].toLowerCase()];
          else state=stM[1].toUpperCase();
          str=str.slice(0,stM.index).trim();
        }
        /* Split remaining into address + city */
        let address=str,city='';
        const knownCities=['fresno','clovis','visalia','madera','hanford','tulare','bakersfield','sacramento','stockton','modesto','merced','los angeles','san francisco','san jose','san diego','san mateo','union city','las vegas','los banos','selma','reedley','dinuba','sanger','kingsburg','parlier','fowler','kerman','coalinga','lemoore','porterville','delano','wasco','shafter','arvin','tehachapi','ridgecrest','manteca','tracy','turlock','atwater','chowchilla','exeter','lindsay','woodlake','orange cove','mendota','firebaugh','gustine','newman','patterson','riverbank','oakdale','escalon','ripon','lathrop','livingston','dos palos','south dos palos','huron','avenal','corcoran','west fresno','north fresno','east fresno','southeast fresno','southwest fresno','tower district'];
        const lower=str.toLowerCase();
        let found='';
        for(const c of knownCities){if(lower.endsWith(' '+c)||lower===c){found=c;break;}}
        if(found){city=str.slice(str.length-found.length);address=str.slice(0,str.length-found.length).trim();}
        return{address,city,state,zip};
      };

      const cleanPhone=(p)=>{if(!p)return '';return String(p).replace(/^Phone:\s*/i,'').replace(/^Phone\s*/i,'').trim();};

      const parsed=[];
      for(let i=0;i<rows.length;i++){
        const r=rows[i];const name=String(r[nameIdx]||'').trim();
        if(!name)continue;
        const rawAddr=addrIdx>=0?String(r[addrIdx]||'').trim():'';
        const hasSepateCols=cityIdx>=0;
        const addrParts=hasSepateCols?null:parseAddr(rawAddr);

        parsed.push({
          name,
          address:hasSepateCols?rawAddr:(addrParts?addrParts.address:''),
          city:hasSepateCols?(cityIdx>=0?String(r[cityIdx]||'').trim():''):(addrParts?addrParts.city:''),
          state:hasSepateCols?(stateIdx>=0?String(r[stateIdx]||'').trim():''):(addrParts?addrParts.state:''),
          zip:hasSepateCols?(zipIdx>=0?String(r[zipIdx]||'').trim():''):(addrParts?addrParts.zip:''),
          phone:cleanPhone(phoneIdx>=0?r[phoneIdx]:''),
          email:emailIdx>=0?String(r[emailIdx]||'').trim():'',
          contact:contactIdx>=0?String(r[contactIdx]||'').trim():'',
          notes:notesIdx>=0?String(r[notesIdx]||'').trim():'',
          pricing:notesIdx>=0?String(r[notesIdx]||'').trim():''
        });
      }
      setImportPreview(parsed);
    }catch(err){alert('Error reading file: '+err.message);}
    setImporting(false);
    if(importRef.current)importRef.current.value='';
  };

  const [updateExisting,setUpdateExisting]=useState(true);
  const doImport=async()=>{
    if(!importPreview||!importPreview.length)return;
    setImporting(true);
    try{
      const r=await fetch('/api/customers/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customers:importPreview,updateExisting})});
      const result=await r.json();
      const msgs=[];
      if(result.imported)msgs.push(result.imported+' new customers added');
      if(result.updated)msgs.push(result.updated+' existing customers updated');
      alert(msgs.length?msgs.join(', ')+'!':'No changes made.');
      setImportPreview(null);
    }catch(err){alert('Import error: '+err.message);}
    setImporting(false);
  };

  const customers=data.customers||[];
  const filtered=search?customers.filter(c=>{
    const s=search.toLowerCase();
    return (c.name||'').toLowerCase().includes(s)||(c.city||'').toLowerCase().includes(s)||(c.contact||'').toLowerCase().includes(s)||(c.address||'').toLowerCase().includes(s);
  }):customers;
  filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||''));

  return(<div>
    <div style={{display:'flex',gap:12,marginBottom:16,alignItems:'center',flexWrap:'wrap'}}>
      <button className="bp" onClick={openAdd} style={{fontSize:14,padding:'8px 20px'}}>+ Add Customer</button>
      <label style={{display:'inline-block',background:'#16a34a',color:'#fff',padding:'8px 16px',borderRadius:6,fontSize:14,cursor:'pointer'}}>
        Import File<input ref={importRef} type="file" accept=".csv,.xlsx,.xls" onChange={parseFile} style={{display:'none'}}/>
      </label>

      {importing&&<span style={{fontSize:12,color:'var(--primary)'}}>Processing...</span>}
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search customers..." style={{flex:1,minWidth:200,fontSize:14,padding:'8px 12px'}}/>
      <span style={{fontSize:13,color:'var(--text-muted)'}}>{filtered.length} customer{filtered.length!==1?'s':''}</span>
    </div>

    {importPreview&&<div style={{background:'#fffbeb',border:'2px solid #d97706',borderRadius:10,padding:16,marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div><strong style={{fontSize:15}}>Preview: {importPreview.length} customers found</strong><div style={{fontSize:12,color:'#92400e'}}>Review below, then click Import.</div></div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <label style={{fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:4,background:'#fff',padding:'4px 10px',borderRadius:6,border:'1px solid #d97706'}}>
            <input type="checkbox" checked={updateExisting} onChange={e=>setUpdateExisting(e.target.checked)} style={{width:'auto'}}/>
            Update existing customers
          </label>
          <button className="bc" onClick={()=>setImportPreview(null)}>Cancel</button>
          <button className="bp" onClick={doImport} style={{background:'#16a34a'}}>Import {importPreview.length} Customers</button>
        </div>
      </div>
      <div style={{maxHeight:300,overflowY:'auto',fontSize:12}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{background:'#fef3c7'}}>
            <th style={{padding:'4px 8px',textAlign:'left',borderBottom:'1px solid #d97706'}}>Name</th>
            <th style={{padding:'4px 8px',textAlign:'left',borderBottom:'1px solid #d97706'}}>Address</th>

/* ============ DOCUMENTS ============ */
function Documents(){
  const [docs,setDocs]=useState([]);
  const [uploading,setUploading]=useState(false);
  const [category,setCategory]=useState('General');
  const fileRef=useRef(null);
  const categories=['General','Safety','Permits','Training','Manifests','Inspections','Insurance','Contracts','Other'];

  const loadDocs=async()=>{
    try{const r=await fetch('/api/documents');const d=await r.json();setDocs(d);}catch(e){console.error('Load docs error:',e);}
  };
  useEffect(()=>{loadDocs();},[]);

  const uploadFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    setUploading(true);
    try{
      const fd=new FormData();fd.append('file',file);fd.append('category',category);
      const r=await fetch('/api/documents',{method:'POST',body:fd});
      if(r.ok){await loadDocs();}else{alert('Upload failed');}
    }catch(err){alert('Upload error: '+err.message);}
    setUploading(false);
    if(fileRef.current)fileRef.current.value='';
  };

  const deleteDoc=async(id,name)=>{
    if(!confirm('Delete "'+name+'"?'))return;
    await fetch('/api/documents/'+id,{method:'DELETE'});
    loadDocs();
  };

  const formatSize=(bytes)=>{
    if(bytes<1024)return bytes+' B';
    if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';
    return(bytes/1048576).toFixed(1)+' MB';
  };

  const formatDate=(iso)=>{
    const d=new Date(iso);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  };

  const getIcon=(name)=>{
    const ext=name.split('.').pop().toLowerCase();
    if(ext==='pdf')return'\uD83D\uDCC4';
    if(['doc','docx'].includes(ext))return'\uD83D\uDCC3';
    if(['xls','xlsx'].includes(ext))return'\uD83D\uDCCA';
    if(['jpg','jpeg','png','gif'].includes(ext))return'\uD83D\uDDBC';
    return'\uD83D\uDCC1';
  };

  const [filterCat,setFilterCat]=useState('All');
  const filtered=filterCat==='All'?docs:docs.filter(d=>d.category===filterCat);

  return(<div>
    <div style={{background:'var(--bg-white)',borderRadius:10,padding:20,marginBottom:16,boxShadow:'var(--shadow)'}}>
      <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap',marginBottom:16}}>
        <label style={{fontWeight:700,fontSize:14}}>Upload Document:</label>
        <select value={category} onChange={e=>setCategory(e.target.value)} style={{width:'auto',fontSize:13,padding:'6px 10px'}}>
          {categories.map(c=>(<option key={c}>{c}</option>))}
        </select>
        <input ref={fileRef} type="file" onChange={uploadFile} style={{fontSize:13}} accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.png,.jpg,.jpeg,.gif"/>
        {uploading&&<span style={{fontSize:12,color:'var(--primary)'}}>Uploading...</span>}
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className={filterCat==='All'?'bp':'bc'} style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setFilterCat('All')}>All ({docs.length})</button>
        {categories.map(c=>{const cnt=docs.filter(d=>d.category===c).length;return cnt>0?(<button key={c} className={filterCat===c?'bp':'bc'} style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setFilterCat(c)}>{c} ({cnt})</button>):null;})}
      </div>
    </div>

    {filtered.length===0&&<div style={{textAlign:'center',padding:40,color:'#999',fontSize:14}}>No documents{filterCat!=='All'?' in '+filterCat:''}. Upload files using the form above.</div>}

    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {filtered.map(doc=>(
        <div key={doc.id} style={{background:'var(--bg-white)',borderRadius:8,padding:'12px 16px',boxShadow:'var(--shadow)',display:'flex',alignItems:'center',gap:12}}>
          <a href={'/api/documents/'+doc.id+'/view'} target="_blank" style={{fontSize:24,textDecoration:'none',cursor:'pointer'}}>{getIcon(doc.name)}</a>
          <div style={{flex:1,minWidth:0,cursor:'pointer'}} onClick={()=>window.open('/api/documents/'+doc.id+'/view','_blank')}>
            <div style={{fontWeight:600,fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--primary)'}}>{doc.name}</div>
            <div style={{fontSize:11,color:'var(--text-muted)'}}>{doc.category} &bull; {formatSize(doc.size)} &bull; {formatDate(doc.uploadedAt)}</div>
          </div>
          <a href={'/api/documents/'+doc.id+'/view'} target="_blank" style={{background:'var(--primary)',color:'#fff',padding:'5px 12px',borderRadius:6,fontSize:12,textDecoration:'none',whiteSpace:'nowrap'}}>View</a>
          <a href={'/api/documents/'+doc.id+'/download'} style={{background:'#475569',color:'#fff',padding:'5px 12px',borderRadius:6,fontSize:12,textDecoration:'none',whiteSpace:'nowrap'}}>Download</a>
          <button style={{background:'#fee2e2',color:'var(--danger)',fontSize:12,padding:'5px 12px'}} onClick={()=>deleteDoc(doc.id,doc.name)}>Delete</button>
        </div>
      ))}
    </div>
  </div>);
}

function WasteProfiles({data}) {
  const [profiles, setProfiles] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [search, setSearch] = useState('');
  const [parsing, setParsing] = useState(false);

    // Auto-generated / SDS data
    profileNotes: '', sdsFiles: [], suggestedPercentages: '',
    toxicity: [], reactivityFlags: [], incompatibles: '', stabilityNotes: '',
    estimatedFlashPoint: '', estimatedPH: '', uhcMatches: []
  };
  const emptyEwsForm = {
    profileType: 'ews',
    name: '', customer: '',
    profileIsNew: 'New Profile',
    // Generator Info
    generatorSiteAddress: '', generatorCity: '', generatorState: '', generatorZip: '',
    epaId: '', generatorMailingAddress: '', generatorMailingCity: '', generatorMailingCountry: '',
    generatorMailingState: '', generatorMailingZip: '',
    technicalContact: 'Keith Higgins', generatorPhone: '(559) 243-6169',
    // Waste Properties
    processGenerating: '', epaHazardous: 'No', stateCodes: '',
    commonName: '', properShippingName: '',
    physicalState: '', methodOfShipment: '', shipmentSize: '', shipmentQuantity: '',
    frequency: '', specialHandling: 'WEAR CORRECT PPE',
    // Composition
    chemicals: [],
    // Sampling
    sampleType: '',
    samplingSource: '', dateSampled: '', samplerName: '', sdsProductName: '',
    // Characteristics
    color: '', odor: '', freeLiquidsPercent: '', percentSolids: '',
    pHValue: '', flashPoint: '', liquidPhases: '',
    containsRegulatedHazWaste: 'No', containsPCBs: 'No',
    regulatedToxicMaterial: 'No', radioactive: 'No', infectiousMedical: 'No',
    // Auto-generated / SDS data
    profileNotes: '', sdsFiles: [],
    estimatedFlashPoint: '', estimatedPH: '',
    toxicity: [], reactivityFlags: [], incompatibles: '', stabilityNotes: ''
  };

  const [form, setForm] = useState(emptyForm);
  const [newEpaCode, setNewEpaCode] = useState('');
  const [newCaCode, setNewCaCode] = useState('');

  // Load profiles
  const loadProfiles = async () => {
    try {
      const r = await fetch('/api/profiles');
      const p = await r.json();
      setProfiles(p);
    } catch(e) { console.error('Load profiles error:', e); }
  };
  const loadSuggestions = async () => {
    try {
      const r = await fetch('/api/suggestions');
      const s = await r.json();
      setSuggestions(s);
    } catch(e) { console.error('Load suggestions error:', e); }
  };
  useEffect(() => { loadProfiles(); loadSuggestions(); }, []);

  // Helper: render a datalist for a field's suggestions
  const sug = (field) => (suggestions[field] || []);

  // Upload SDS and parse
  const uploadSDS = async (files) => {
    setParsing(true);
    try {
      const fd = new FormData();
      Array.from(files).forEach(f => fd.append('files', f));
      const r = await fetch('/api/sds/parse', { method: 'POST', body: fd });
      const result = await r.json();
      if (result.merged) {
        var m = result.merged;
        // Map chemicals from SDS format to composition table format
        var mappedChemicals = (m.chemicals || []).map(function(c) {
          return { name: c.name || '', cas: c.cas || '', units: '%', tclp: false, totals: false, typical: c.percentage || '', min: '', max: '' };
        });
        // Map flash point — use numeric °F value from backend, or extract first number
        var fpVal = m.flashPoint || '';
        var fpNum = m.flashPointNumF != null ? m.flashPointNumF : NaN;
        if (isNaN(fpNum)) {
          var fpFirstNum = String(fpVal).match(/(-?\d+\.?\d*)/);
          fpNum = fpFirstNum ? parseFloat(fpFirstNum[1]) : NaN;
        }
        var fpBelow140 = !isNaN(fpNum) && fpNum < 140;
        // Map pH
        var phVal = m.pH || '';
        var phNum = parseFloat(phVal);
        var phCat = '';
        if (!isNaN(phNum)) {
          if (phNum <= 2) phCat = '<=2';
          else if (phNum >= 12.5) phCat = '>=12.5';
          else phCat = '2<12.5';
        }
        // Map reactivity flags to characteristic fields
        var flags = m.reactivityFlags || [];
        var charOx = '', charExp = '', charShock = '', charWater = '', charPyro = '', charTherm = '';
        flags.forEach(function(f) {
          var fl = f.toLowerCase();
          if (fl.indexOf('oxidizer') >= 0) charOx = 'Yes';
          if (fl.indexOf('explosive') >= 0 || fl.indexOf('shock') >= 0) { charExp = 'Yes'; charShock = 'Yes'; }
          if (fl.indexOf('water-reactive') >= 0) charWater = 'Yes';
          if (fl.indexOf('air-reactive') >= 0 || fl.indexOf('pyrophoric') >= 0) charPyro = 'Yes';
          if (fl.indexOf('polymerize') >= 0) charTherm = 'Yes';
        });
        // Determine if LDR restricted based on D-codes
        var epaCodes = m.epaWasteCodes || [];
        var hasD = epaCodes.some(function(c) { return c.charAt(0) === 'D'; });
        // Pre-fill form with parsed data
        setForm({
          ...emptyForm,
          chemicals: mappedChemicals,
          unNumber: m.unNumber || '',
          properShippingName: m.properShippingName || '',
          hazardClass: m.hazardClass || '',
          packingGroup: m.packingGroup || '',
          epaWasteCodes: epaCodes,
          caWasteCodes: m.caWasteCodes || [],
          flashPointF: !isNaN(fpNum) ? String(fpNum) : fpVal,
          flashPointBelow140: fpBelow140,
          pHTypical: phVal,
          pHCategory: phCat,
          physicalState: m.physicalState || '',
          color: m.color || '',
          odor: m.odor || '',
          knowledgeSource: 'MSDS',
          ldrRestricted: hasD ? 'Yes' : '',
          uhcAboveTreatmentStd: (m.uhcMatches || []).length > 0 ? 'Yes' : '',
          charOxidizer: charOx, charExplosive: charExp, charShockSensitive: charShock,
          charWaterAirReactive: charWater, charPyrophoric: charPyro, charThermallyUnstable: charTherm,
          sdsFiles: m.sdsFiles || [],
          profileNotes: '',
          toxicity: m.toxicity || [],
          reactivityFlags: flags,
          incompatibles: m.incompatibles || '',
          stabilityNotes: m.stabilityNotes || '',
          estimatedFlashPoint: m.estimatedFlashPoint || '',
          estimatedPH: m.estimatedPH || '',
          uhcMatches: m.uhcMatches || []
        });
        setEditId(null);
        setShowForm(true);
      }
    } catch(e) { alert('Error parsing SDS: ' + e.message); }
    setParsing(false);
  };

  // Upload SDS for EWS profiles
  const uploadEwsSDS = async (files) => {
    setParsing(true);
    try {
      const fd = new FormData();
      Array.from(files).forEach(f => fd.append('files', f));
      const r = await fetch('/api/sds/parse', { method: 'POST', body: fd });
      const result = await r.json();
      if (result.merged) {
        var m = result.merged;
        var mappedChemicals = (m.chemicals || []).map(function(c) {
          return { name: c.name || '', cas: c.cas || '', percentage: c.percentage || '' };
        });
        var fpVal = m.flashPoint || '';
        var fpNum = m.flashPointNumF != null ? m.flashPointNumF : NaN;
        if (isNaN(fpNum)) {
          var fpFirstNum = String(fpVal).match(/(-?\d+\.?\d*)/);
          fpNum = fpFirstNum ? parseFloat(fpFirstNum[1]) : NaN;
        }
        setForm({
          ...emptyEwsForm,
          chemicals: mappedChemicals,
          properShippingName: m.properShippingName || '',
          physicalState: m.physicalState || '',
          color: m.color || '',
          odor: m.odor || '',
          pHValue: m.pH || '',
          flashPoint: !isNaN(fpNum) ? String(fpNum) + ' °F' : fpVal,
          sdsFiles: m.sdsFiles || [],
          estimatedFlashPoint: m.estimatedFlashPoint || '',
          estimatedPH: m.estimatedPH || '',
          toxicity: m.toxicity || [],
          reactivityFlags: m.reactivityFlags || [],
          incompatibles: m.incompatibles || '',
          stabilityNotes: m.stabilityNotes || ''
        });
        setEditId(null);
        setShowForm(true);
      }
    } catch(e) { alert('Error parsing SDS: ' + e.message); }
    setParsing(false);
  };

  // Save profile
  const save = async () => {
    if (!form.name.trim()) { alert('Please enter a profile name'); return; }
    const payload = { ...form };
    if (editId) {
      await fetch('/api/profiles/' + editId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } else {
      await fetch('/api/profiles', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }
    setShowForm(false); setEditId(null); setForm(emptyForm);
    loadProfiles();
    loadSuggestions();
  };

  const openEdit = (p) => {
    if (p.profileType === 'ews') {
      setEditId(p.id);
      setForm({
        profileType: 'ews',
        name: p.name || '', customer: p.customer || '',
        generatorSiteAddress: p.generatorSiteAddress || '', generatorCity: p.generatorCity || '',
        generatorState: p.generatorState || '', generatorZip: p.generatorZip || '',
        epaId: p.epaId || '',
        generatorMailingAddress: p.generatorMailingAddress || '',
        generatorMailingCity: p.generatorMailingCity || '', generatorMailingCountry: p.generatorMailingCountry || '',
        generatorMailingState: p.generatorMailingState || '', generatorMailingZip: p.generatorMailingZip || '',
        technicalContact: p.technicalContact || 'Keith Higgins', generatorPhone: p.generatorPhone || '(559) 243-6169',
        processGenerating: p.processGenerating || '', epaHazardous: p.epaHazardous || 'No',

  const removeCaCode = (code) => {

  // Filter profiles
  const filtered = search ? profiles.filter(p => {

  const HC_MAP = {

    '4.2': 'Spont. Combustible', '4.3': 'Dangerous When Wet', '5.1': 'Oxidizer',

    '8': 'Corrosive', '9': 'Miscellaneous'

      if (cust.contact) updates.technicalContact = cust.contact;

      if (cust.epaId) updates.epaId = cust.epaId;
      if (cust.stateId) updates.stateId = cust.stateId;
      if (cust.naicsCodes) updates.naicsCodes = cust.naicsCodes;
      if (cust.generatorStatus) updates.generatorStatus = cust.generatorStatus;

  const onEwsGeneratorChange = (val) => {
    var updates = { customer: val };
    var cust = (data.customers || []).find(function(c) { return c.name === val; });
    if (cust) {
      if (cust.address) updates.generatorSiteAddress = cust.address;
      if (cust.city) updates.generatorCity = cust.city;
      if (cust.state) updates.generatorState = cust.state;
      if (cust.zip) updates.generatorZip = cust.zip;
      if (cust.epaId) updates.epaId = cust.epaId;
      if (cust.contact) updates.technicalContact = cust.contact;
      if (cust.phone) updates.generatorPhone = cust.phone;

              </div>
              <div style={{ display: 'flex', gap: 6 }}>

            {expandedId === p.id && (
              <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--border)' }}>

                {(p.epaId || p.generatorSiteAddress || p.technicalContact || p.customer) && (
                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontWeight: 700, fontSize: 12, color: '#374151', marginBottom: 4 }}>Generator Information</div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '4px 16px', fontSize: 13 }}>
                      {p.customer && <div><strong>Generator:</strong> {p.customer}</div>}
                      {p.generatorSiteAddress && <div><strong>Site Address:</strong> {p.generatorSiteAddress}{p.generatorCity ? ', ' + p.generatorCity : ''}{p.generatorState ? ', ' + p.generatorState : ''} {p.generatorZip || ''}</div>}

                      {p.technicalContact && <div><strong>Contact:</strong> {p.technicalContact}</div>}
                      {p.generatorPhone && <div><strong>Phone:</strong> {p.generatorPhone}</div>}
                    </div>
                  </div>
                )}
                {/* Waste Properties */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '8px 16px', fontSize: 13, marginBottom: 12 }}>
                  {p.processGenerating && <div><strong>Process:</strong> {p.processGenerating}</div>}
                  {p.commonName && <div><strong>Common Name:</strong> {p.commonName}</div>}
                  {p.properShippingName && <div><strong>DOT Shipping Name:</strong> {p.properShippingName}</div>}
                  {p.physicalState && <div><strong>Physical State:</strong> {p.physicalState}</div>}
                  {p.methodOfShipment && <div><strong>Method of Shipment:</strong> {p.methodOfShipment}</div>}
                  {p.shipmentSize && <div><strong>Shipment Size:</strong> {p.shipmentSize}</div>}
                  {p.shipmentQuantity && <div><strong>Quantity:</strong> {p.shipmentQuantity}</div>}
                  {p.frequency && <div><strong>Frequency:</strong> {p.frequency}</div>}
                  {p.specialHandling && <div><strong>Special Handling:</strong> {p.specialHandling}</div>}
                </div>
                {/* Characteristics */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '8px 16px', fontSize: 13, marginBottom: 12 }}>

                  {p.odor && <div><strong>Odor:</strong> {p.odor}</div>}
                  {p.pHValue && <div><strong>pH:</strong> {p.pHValue}</div>}
                  {p.flashPoint && <div><strong>Flash Point:</strong> {p.flashPoint}</div>}
                  {p.freeLiquidsPercent && <div><strong>Free Liquids %:</strong> {p.freeLiquidsPercent}</div>}
                  {p.percentSolids && <div><strong>% Solids:</strong> {p.percentSolids}</div>}
                  {p.liquidPhases && <div><strong>Liquid Phases:</strong> {p.liquidPhases}</div>}
                </div>
                {/* Yes/No flags */}
                {(function() {
                  var flags = [
                    ['Regulated Haz Waste', p.containsRegulatedHazWaste],
                    ['Contains PCBs', p.containsPCBs],
                    ['Regulated Toxic', p.regulatedToxicMaterial],
                    ['Radioactive', p.radioactive],
                    ['Infectious/Medical', p.infectiousMedical]
                  ].filter(function(x) { return x[1] && x[1] !== 'No'; });
                  if (flags.length === 0) return null;
                  return React.createElement('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 4, marginBottom: 8 } },
                    flags.map(function(x, i) {
                      return React.createElement('span', { key: i, style: { background: '#fee2e2', color: '#991b1b', padding: '2px 8px', borderRadius: 4, fontSize: 11, fontWeight: 600 } }, x[0] + ': ' + x[1]);
                    })
                  );
                })()}
                {/* Sampling Info */}
                {(p.samplingSource || p.dateSampled || p.samplerName || p.sdsProductName) && (
                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontWeight: 700, fontSize: 12, color: '#374151', marginBottom: 4 }}>Sampling Information</div>

                      {p.samplingSource && <div><strong>Source:</strong> {p.samplingSource}</div>}
                      {p.dateSampled && <div><strong>Date Sampled:</strong> {p.dateSampled}</div>}
                      {p.samplerName && <div><strong>Sampler:</strong> {p.samplerName}</div>}
                      {p.sdsProductName && <div><strong>SDS Product:</strong> {p.sdsProductName}</div>}
                    </div>
                  </div>

                {/* Composition */}
                {p.chemicals && p.chemicals.length > 0 && (
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 6, color: '#059669' }}>Composition</div>

                              <td style={{ fontWeight: 600 }}>{c.name}</td>
                              <td>{c.cas || '—'}</td>
                              <td>{c.percentage || '—'}</td>
                            </tr>

                        </tbody>
                      </table>
                    </div>

                {/* Mixture estimates */}
                {(p.estimatedFlashPoint || p.estimatedPH) && (

                {p.toxicity && p.toxicity.length > 0 && (
                  <div style={{ marginBottom: 8, fontSize: 13 }}>
                    <strong>Toxicity: </strong>

                <div style={{ marginTop: 6, fontSize: 11, color: 'var(--text-muted)' }}>

                </div>
              </div>
            )}
          </div>
        ))}
      </div>

            <div className="mrow" style={{marginBottom:0}}><label style={{fontSize:13}}>Generator (Customer)</label>

          </div>
          <div className="mrow" style={{marginBottom:8}}><label style={{fontSize:13}}>Facility Address</label>
            <input value={form.facilityAddress} onChange={e => setForm({ ...form, facilityAddress: e.target.value })} placeholder="Street, City, State, ZIP" style={{fontSize:12}} /></div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12, marginBottom: 8 }}>

              <input value={form.technicalContact} onChange={e => setForm({ ...form, technicalContact: e.target.value })} placeholder="Contact name" style={{fontSize:12}} /></div>
            <div className="mrow" style={{marginBottom:0}}><label style={{fontSize:13}}>Phone</label>
              <input value={form.generatorPhone} onChange={e => setForm({ ...form, generatorPhone: e.target.value })} placeholder="(xxx) xxx-xxxx" style={{fontSize:12}} /></div>
            <div className="mrow" style={{marginBottom:0}}><label style={{fontSize:13}}>Fax</label>
              <input value={form.generatorFax} onChange={e => setForm({ ...form, generatorFax: e.target.value })} placeholder="(xxx) xxx-xxxx" style={{fontSize:12}} /></div>
          </div>
          <div style={{marginBottom:8}}>
            <label style={{fontSize:13,fontWeight:600,display:'block',marginBottom:4}}>Generator Status</label>

                <label key={s} style={{fontSize:12,display:'inline-flex',alignItems:'center',gap:3,cursor:'pointer'}}>
                  <input type="radio" name="generatorStatus" value={s} checked={form.generatorStatus===s} onChange={e=>setForm({...form,generatorStatus:e.target.value})}/>{s}
                </label>

              <input value={form.epaId} onChange={e => setForm({ ...form, epaId: e.target.value })} placeholder="e.g. CAD123456789" style={{fontSize:12}} /></div>
            <div className="mrow" style={{marginBottom:0}}><label style={{fontSize:13}}>State ID #</label>
              <input value={form.stateId} onChange={e => setForm({ ...form, stateId: e.target.value })} placeholder="State ID" style={{fontSize:12}} /></div>
            <div className="mrow" style={{marginBottom:0}}><label style={{fontSize:13}}>NAICS Codes</label>
              <input value={form.naicsCodes} onChange={e => setForm({ ...form, naicsCodes: e.target.value })} placeholder="e.g. 562211" style={{fontSize:12}} /></div>
          </div>

              <option value="Year">Year</option><option value="Quarterly">Quarterly</option><option value="Monthly">Monthly</option>
              <option value="1 time">1 time</option><option value="Other">Other</option>

            <div style={{marginBottom:0}}>

              </label>

                <input type="radio" name="wasteImport" value="No" checked={form.wasteImport==='No'} onChange={e=>setForm({...form,wasteImport:e.target.value})}/>No
              </label>

              <select value={form.odor} onChange={e => setForm({ ...form, odor: e.target.value })} style={{fontSize:12}}>

              </select></div>
